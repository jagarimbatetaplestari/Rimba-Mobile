<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rimba — Supabase Email Templates Visualizer & Copy Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAF8;
      color: #1E293B;
    }
    .serif-title {
      font-family: 'Playfair Display', Georgia, serif;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">
  <div class="max-w-5xl w-full space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 p-6 rounded-3xl bg-white border border-slate-200 shadow-sm">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold mb-2">
          <span>🌿</span> RIMBA SUPABASE AUTH TEMPLATES
        </div>
        <h1 class="serif-title italic text-2xl sm:text-3xl font-medium text-slate-900">Email Templates & Copy Center</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Clean Alabaster White & Forest Green email templates for Supabase Dashboard.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="viewMobile" onclick="setViewMode('mobile')" class="px-3 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 transition-colors">
          📱 Mobile View
        </button>
        <button id="viewDesktop" onclick="setViewMode('desktop')" class="px-3 py-1.5 rounded-xl text-xs font-medium border border-emerald-300 bg-emerald-50 text-emerald-800 transition-colors">
          💻 Desktop View
        </button>
      </div>
    </div>

    <!-- Tabs (6 Template Supabase) -->
    <div class="flex flex-wrap gap-2 p-1.5 rounded-2xl bg-white border border-slate-200 shadow-xs">
      <button onclick="switchTab('confirmation')" id="tab-confirmation" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all bg-emerald-600 text-white shadow-sm">
        1. Confirm Sign Up
      </button>
      <button onclick="switchTab('invite')" id="tab-invite" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:text-slate-900">
        2. Invite User
      </button>
      <button onclick="switchTab('magic_link')" id="tab-magic_link" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:text-slate-900">
        3. Magic Link / OTP
      </button>
      <button onclick="switchTab('email_change')" id="tab-email_change" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:text-slate-900">
        4. Change Email
      </button>
      <button onclick="switchTab('recovery')" id="tab-recovery" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:text-slate-900">
        5. Reset Password
      </button>
      <button onclick="switchTab('reauthentication')" id="tab-reauthentication" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:text-slate-900">
        6. Reauthentication
      </button>
    </div>

    <!-- Instructions & Action Bar -->
    <div class="p-4 rounded-2xl bg-emerald-50/60 border border-emerald-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs">
      <div class="flex flex-col gap-1">
        <div>
          <span class="text-emerald-900 font-bold">Recommended Subject:</span>
          <code id="subjectText" class="ml-2 font-mono text-emerald-800 bg-white px-2.5 py-1 rounded border border-emerald-200 select-all shadow-2xs">
            Your Rimba Verification Code: {{ .Token }} — Welcome to Sanctuary
          </code>
        </div>
        <div class="text-[11px] text-slate-600 flex items-center gap-2 mt-0.5">
          <span>🔗 Dashboard Tab:</span>
          <a id="dashboardLink" href="https://supabase.com/dashboard/project/rkljugrrscmqopeuwtpd/auth/templates/confirm-sign-up" target="_blank" rel="noopener noreferrer" class="text-emerald-700 font-semibold underline hover:text-emerald-900 transition-colors">
            Open This Template in Supabase Dashboard →
          </a>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto">
        <button onclick="copyCurrentTemplate()" id="copyBtn" class="w-full sm:w-auto px-4 py-2 rounded-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs shadow-sm transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <span>📋</span>
          <span id="copyBtnText">Copy HTML Template</span>
        </button>
      </div>
    </div>

    <!-- Frame Container -->
    <div class="w-full flex justify-center py-2">
      <div id="frameWrapper" class="w-full max-w-2xl transition-all duration-300 rounded-[32px] overflow-hidden border border-slate-200 shadow-md bg-[#F7F9F7]">
        <iframe id="previewFrame" src="confirmation.html" class="w-full h-[700px] border-0"></iframe>
      </div>
    </div>
  </div>

  <script>
    const templates = {
      confirmation: {
        file: 'confirmation.html',
        subject: 'Your Rimba Verification Code: {{ .Token }} — Welcome to Sanctuary',
        url: 'https://supabase.com/dashboard/project/rkljugrrscmqopeuwtpd/auth/templates/confirm-sign-up'
      },
      invite: {
        file: 'invite.html',
        subject: "You're Invited to Rimba Sanctuary — Begin Your Mindful Journey",
        url: 'https://supabase.com/dashboard/project/rkljugrrscmqopeuwtpd/auth/templates/invite-user'
      },
      magic_link: {
        file: 'magic_link.html',
        subject: 'Your Rimba Sign-In Code: {{ .Token }} — Resume Your Focus',
        url: 'https://supabase.com/dashboard/project/rkljugrrscmqopeuwtpd/auth/templates/magic-link-or-otp'
      },
      email_change: {
        file: 'email_change.html',
        subject: 'Confirm Email Change for Rimba: {{ .Token }}',
        url: 'https://supabase.com/dashboard/project/rkljugrrscmqopeuwtpd/auth/templates/change-email-address'
      },
      recovery: {
        file: 'recovery.html',
        subject: 'Reset Your Rimba Password: {{ .Token }} — Account Recovery',
        url: 'https://supabase.com/dashboard/project/rkljugrrscmqopeuwtpd/auth/templates/reset-password'
      },
      reauthentication: {
        file: 'reauthentication.html',
        subject: 'Confirm Your Identity for Rimba: {{ .Token }} — Sensitive Action',
        url: 'https://supabase.com/dashboard/project/rkljugrrscmqopeuwtpd/auth/templates/reauthentication'
      }
    };

    let activeTab = 'confirmation';

    function switchTab(key) {
      activeTab = key;
      const t = templates[key];

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-slate-600 hover:text-slate-900';
      });
      const activeBtn = document.getElementById('tab-' + key);
      if (activeBtn) {
        activeBtn.className = 'tab-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition-all bg-emerald-600 text-white shadow-sm';
      }

      document.getElementById('subjectText').textContent = t.subject;
      document.getElementById('dashboardLink').href = t.url;
      document.getElementById('previewFrame').src = t.file;
    }

    function setViewMode(mode) {
      const wrapper = document.getElementById('frameWrapper');
      const btnMobile = document.getElementById('viewMobile');
      const btnDesktop = document.getElementById('viewDesktop');

      if (mode === 'mobile') {
        wrapper.className = 'w-[375px] transition-all duration-300 rounded-[32px] overflow-hidden border border-slate-300 shadow-lg bg-[#F7F9F7]';
        btnMobile.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-emerald-300 bg-emerald-50 text-emerald-800 transition-colors';
        btnDesktop.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 transition-colors';
      } else {
        wrapper.className = 'w-full max-w-2xl transition-all duration-300 rounded-[32px] overflow-hidden border border-slate-200 shadow-md bg-[#F7F9F7]';
        btnDesktop.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-emerald-300 bg-emerald-50 text-emerald-800 transition-colors';
        btnMobile.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 transition-colors';
      }
    }

    async function copyCurrentTemplate() {
      const t = templates[activeTab];
      const copyBtnText = document.getElementById('copyBtnText');

      try {
        const res = await fetch(t.file);
        const html = await res.text();
        await navigator.clipboard.writeText(html);

        copyBtnText.textContent = 'Copied to Clipboard! ✓';
        setTimeout(() => {
          copyBtnText.textContent = 'Copy HTML Template';
        }, 2000);
      } catch (err) {
        alert('Failed to copy automatically. Please open ' + t.file + ' directly.');
      }
    }
  </script>
</body>
</html>
