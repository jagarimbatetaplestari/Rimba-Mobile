name: Build Rimba iOS IPA (SideStore / AltStore)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Export Next.js Static Web Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rkljugrrscmqopeuwtpd.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrbGp1Z3Jyc2NtcW9wZXV3dHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTg2NzcsImV4cCI6MjEwNzAzNDY3N30.5ZGZjrPq8cCMBhX_pIuMOsFjq0H50JhhLHdIlmo5HQ0' }}
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Build Xcode Archive (Unsigned for Sideloading)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA for SideStore / AltStore
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qry Rimba.ipa Payload
          cd ..
          ls -lh build/Rimba.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rimba-SideStore-IPA
          path: build/Rimba.ipa
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            NAME="Rimba Mobile $TAG"
          else
            TAG="v0.1.0-build-${{ github.run_number }}"
            NAME="Rimba Mobile v0.1.0 (Build #${{ github.run_number }})"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body: |
            ## 🌲 Rimba Mobile — Digital Garden & Focus World
            **IPA Build untuk Sideload SideStore / AltStore**

            ### 📲 Cara Install di iPhone via SideStore / AltStore:
            1. Buka halaman rilis ini di browser Safari iPhone Anda.
            2. Unduh file **`Rimba.ipa`** dari bagian **Assets** di bawah.
            3. Buka aplikasi **SideStore** (atau AltStore).
            4. Tap tab **My Apps**, lalu tap ikon `+` di pojok kiri/kanan atas.
            5. Pilih file **`Rimba.ipa`** yang baru diunduh.
            6. SideStore akan menandatangani dengan akun Apple ID Anda, dan Rimba siap digunakan!

            ---
            *Commit: `${{ github.sha }}`*
          files: build/Rimba.ipa
          draft: false
          prerelease: false
