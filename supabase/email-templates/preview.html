<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rimba — Supabase Email Templates Visualizer & Copy Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020905;
      color: #E2E8F0;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">
  <div class="max-w-5xl w-full space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 p-6 rounded-3xl bg-white/[0.03] border border-white/10 backdrop-blur-xl">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold mb-2">
          <span>🌿</span> RIMBA SUPABASE AUTH
        </div>
        <h1 class="serif-title italic text-2xl sm:text-3xl font-medium text-white">Email Templates & Copy Center</h1>
        <p class="text-xs sm:text-sm text-white/60 mt-1">Pratinjau visual & salin template email resmi untuk Supabase Dashboard.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="viewMobile" onclick="setViewMode('mobile')" class="px-3 py-1.5 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 transition-colors">
          📱 Mobile View
        </button>
        <button id="viewDesktop" onclick="setViewMode('desktop')" class="px-3 py-1.5 rounded-xl text-xs font-medium border border-emerald-500/40 bg-emerald-500/20 text-emerald-300 transition-colors">
          💻 Desktop View
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex flex-wrap gap-2 p-1.5 rounded-2xl bg-white/[0.02] border border-white/5">
      <button onclick="switchTab('confirmation')" id="tab-confirmation" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all bg-emerald-500 text-black shadow-lg">
        1. Confirm Signup (OTP)
      </button>
      <button onclick="switchTab('magic_link')" id="tab-magic_link" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all text-white/70 hover:text-white">
        2. Magic Link (Masuk Cepat)
      </button>
      <button onclick="switchTab('recovery')" id="tab-recovery" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all text-white/70 hover:text-white">
        3. Reset Password
      </button>
      <button onclick="switchTab('email_change')" id="tab-email_change" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all text-white/70 hover:text-white">
        4. Change Email
      </button>
    </div>

    <!-- Instructions Bar -->
    <div class="p-4 rounded-2xl bg-emerald-950/20 border border-emerald-500/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs">
      <div>
        <span class="text-emerald-400 font-bold">Subject Email Rekomendasi:</span>
        <code id="subjectText" class="ml-2 font-mono text-emerald-200 bg-black/40 px-2 py-0.5 rounded border border-emerald-500/30 select-all">
          Kode Verifikasi Rimba: {{ .Token }} — Selamat Datang di Suaka Fokus
        </code>
      </div>
      <button onclick="copyCurrentTemplate()" id="copyBtn" class="shrink-0 px-4 py-1.5 rounded-full bg-emerald-400 hover:bg-emerald-300 active:scale-95 text-[#041A12] font-bold text-xs shadow-md transition-all flex items-center gap-1.5">
        <span>📋</span>
        <span id="copyBtnText">Salin Kode HTML Template</span>
      </button>
    </div>

    <!-- Frame Container -->
    <div class="w-full flex justify-center py-4">
      <div id="frameWrapper" class="w-full max-w-2xl transition-all duration-300 rounded-[32px] overflow-hidden border border-white/10 shadow-[0_20px_60px_rgba(0,0,0,0.8)] bg-[#030D08]">
        <iframe id="previewFrame" src="confirmation.html" class="w-full h-[680px] border-0"></iframe>
      </div>
    </div>
  </div>

  <script>
    const templates = {
      confirmation: {
        file: 'confirmation.html',
        subject: 'Kode Verifikasi Rimba: {{ .Token }} — Selamat Datang di Suaka Fokus'
      },
      magic_link: {
        file: 'magic_link.html',
        subject: 'Kode Masuk Rimba: {{ .Token }} — Lanjutkan Sesi Fokusmu'
      },
      recovery: {
        file: 'recovery.html',
        subject: 'Atur Ulang Kata Sandi Rimba: {{ .Token }}'
      },
      email_change: {
        file: 'email_change.html',
        subject: 'Konfirmasi Perubahan Email Rimba: {{ .Token }}'
      }
    };

    let activeTab = 'confirmation';

    function switchTab(tabKey) {
      activeTab = tabKey;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all text-white/70 hover:text-white';
      });
      const activeBtn = document.getElementById('tab-' + tabKey);
      activeBtn.className = 'tab-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all bg-emerald-500 text-black shadow-lg';

      document.getElementById('subjectText').innerText = templates[tabKey].subject;
      document.getElementById('previewFrame').src = templates[tabKey].file;
    }

    function setViewMode(mode) {
      const wrapper = document.getElementById('frameWrapper');
      const btnMobile = document.getElementById('viewMobile');
      const btnDesktop = document.getElementById('viewDesktop');

      if (mode === 'mobile') {
        wrapper.className = 'w-full max-w-[380px] transition-all duration-300 rounded-[36px] overflow-hidden border-4 border-white/20 shadow-[0_20px_60px_rgba(0,0,0,0.8)] bg-[#030D08]';
        btnMobile.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-emerald-500/40 bg-emerald-500/20 text-emerald-300 transition-colors';
        btnDesktop.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 transition-colors';
      } else {
        wrapper.className = 'w-full max-w-2xl transition-all duration-300 rounded-[32px] overflow-hidden border border-white/10 shadow-[0_20px_60px_rgba(0,0,0,0.8)] bg-[#030D08]';
        btnDesktop.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-emerald-500/40 bg-emerald-500/20 text-emerald-300 transition-colors';
        btnMobile.className = 'px-3 py-1.5 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 transition-colors';
      }
    }

    async function copyCurrentTemplate() {
      try {
        const response = await fetch(templates[activeTab].file);
        const html = await response.text();
        await navigator.clipboard.writeText(html);

        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = 'Tersalin ke Clipboard! ✅';
        setTimeout(() => {
          btnText.innerText = 'Salin Kode HTML Template';
        }, 2500);
      } catch (err) {
        alert('Silakan buka file ' + templates[activeTab].file + ' dan salin secara manual.');
      }
    }
  </script>
</body>
</html>
