name: Deploy Rimba to TestFlight / App Store Connect

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan rilis internal TestFlight (opsional)'
        required: false
        default: 'Automated TestFlight build via GitHub Actions'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy-appstore:
    name: Build & Upload to App Store Connect
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID || '475693230434-pd36p3isodu8jo7tem4tgjja8rm5u61b.apps.googleusercontent.com' }}
      NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID || '475693230434-du494aucdevbi7d8gn4v71tse9clhh86.apps.googleusercontent.com' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate Release Configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_KEY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APPLE_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: node scripts/check-release-env.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_KEY }}
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Setup Temporary Keychain & Import Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/appstore_build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          # Buat & buka temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Decode sertifikat P12
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          # Impor langsung dengan fallback OpenSSL -legacy untuk kompatibilitas macOS 15
          if security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild 2>/dev/null; then
            echo "Certificate successfully imported directly into keychain."
          else
            echo "Direct import failed. Retrying with OpenSSL -legacy conversion..."
            openssl pkcs12 -in "$CERT_PATH" -passin pass:"$CERTIFICATE_PASSWORD" -legacy -nodes -out "$RUNNER_TEMP/cert_temp.pem"
            openssl pkcs12 -export -in "$RUNNER_TEMP/cert_temp.pem" -out "$RUNNER_TEMP/cert_legacy.p12" -passout pass:"$CERTIFICATE_PASSWORD"
            security import "$RUNNER_TEMP/cert_legacy.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
            rm -f "$RUNNER_TEMP/cert_temp.pem" "$RUNNER_TEMP/cert_legacy.p12"
            echo "Legacy P12 converted and imported into keychain."
          fi

          # Beri izin partition list untuk codesign tanpa modal prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Install App and Widget provisioning profiles
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          for TARGET in App RimbaWidgets; do
            if [ "$TARGET" = App ]; then DATA="$PROFILE_BASE64"; PREFIX=PROFILE; BUNDLE=com.syntheticae.rimba; else DATA="$WIDGET_PROFILE_BASE64"; PREFIX=WIDGET_PROFILE; BUNDLE=com.syntheticae.rimba.widgets; fi
            TEMP_PROFILE="$RUNNER_TEMP/$TARGET.mobileprovision"
            PROFILE_PLIST="$RUNNER_TEMP/$TARGET-profile.plist"
            printf '%s' "$DATA" | base64 --decode > "$TEMP_PROFILE"
            security cms -D -i "$TEMP_PROFILE" > "$PROFILE_PLIST"
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
            TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")" = "$TEAM.$BUNDLE"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$PROFILE_PLIST")" = 'group.com.syntheticae.rimba'
            cp "$TEMP_PROFILE" "$PROFILES_DIR/$UUID.mobileprovision"
            echo "${PREFIX}_NAME=$NAME" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
            rm -f "$TEMP_PROFILE" "$PROFILE_PLIST"
          done

      - name: Configure App and Widget Manual Signing and Versioning
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ vars.MARKETING_VERSION || '1.0.1' }}
        run: node scripts/configure-ios-signing.cjs

      - name: Archive Xcode Project
        run: |
          mkdir -p build
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ env.KEYCHAIN_PATH }}"

      - name: Export App Store IPA
        run: |
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID || env.APPLE_TEAM_ID || 'VU4PP3SY5B' }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.syntheticae.rimba</key>
                  <string>${{ env.PROFILE_NAME }}</string>
                  <key>com.syntheticae.rimba.widgets</key>
                  <string>${{ env.WIDGET_PROFILE_NAME }}</string>
              </dict>
              <key>destination</key>
              <string>export</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ env.KEYCHAIN_PATH }}"

          # Normalisasi IPA ke build/App.ipa
          mkdir -p build
          IPA_FOUND=$(find build/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FOUND" ]; then
            echo "Error: No IPA found in build/ipa directory!"
            exit 1
          fi
          cp "$IPA_FOUND" build/App.ipa
          echo "App.ipa successfully prepared at build/App.ipa ($(ls -lh build/App.ipa | awk '{print $5}'))"

      - name: Verify signed embedded widget
        run: |
          APP=build/App.xcarchive/Products/Applications/App.app
          WIDGET="$APP/PlugIns/RimbaWidgets.appex"
          test -d "$WIDGET"
          codesign --verify --deep --strict "$APP"
          for TARGET in "$APP" "$WIDGET"; do
            codesign -d --entitlements :- "$TARGET" > build/widget-entitlements.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' build/widget-entitlements.plist)" = 'group.com.syntheticae.rimba'
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET/Info.plist")"
          unzip -l build/App.ipa | grep 'PlugIns/RimbaWidgets.appex/Info.plist'

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Rimba-AppStore-IPA-Build-${{ github.run_number }}
          path: build/App.ipa
          retention-days: 14

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'X4SX9VQZ44' }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          node -e '
            const fs = require("fs");
            const path = require("path");
            const raw = process.env.API_KEY_BASE64 || "";
            let decoded = raw;
            if (!raw.includes("BEGIN PRIVATE KEY")) {
              decoded = Buffer.from(raw, "base64").toString("utf8");
            }
            const keyPath = path.join(process.env.HOME, ".appstoreconnect", "private_keys", `AuthKey_${process.env.KEY_ID}.p8`);
            fs.writeFileSync(keyPath, decoded.trim() + "\n", { mode: 0o600 });
            console.log(`App Store Connect API key written to ${keyPath}`);
          '

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'X4SX9VQZ44' }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'c32ee50b-c9f8-4532-898e-4c793cac57f6' }}
        run: |
          echo "Starting upload to App Store Connect via xcrun altool..."
          xcrun altool --upload-app -f build/App.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress
          echo "Upload to App Store Connect / TestFlight completed successfully!"

      - name: Clean up Temporary Keychain & Keys
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
            echo "Temporary keychain deleted."
          fi
          rm -rf ~/.appstoreconnect/private_keys
